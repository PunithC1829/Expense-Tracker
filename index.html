<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!--page setup and dashboard-->
  <header class="hero">
    <div class="wrap">
      <p class="hero-title">Personal Expense Tracker</p>
      <p class="hero-label">Available balance</p>
      <p class="hero-balance" id="balance">₹0.00</p>

      <div class="flow"><div class="flow-spent" id="flowSpent"></div></div>
      <p class="flow-caption" id="flowCaption">Add your first transaction to get started.</p>

      <dl class="stats">
        <div class="stat"><dt>Total income</dt><dd class="income" id="totalIncome">₹0.00</dd></div>
        <div class="stat"><dt>Total expenses</dt><dd class="expense" id="totalExpense">₹0.00</dd></div>
        <div class="stat"><dt>Transactions</dt><dd id="txnCount">0</dd></div>
      </dl>
    </div>
  </header>

  <!--the add-transaction form -->


    <main class="wrap layout">

    <section class="panel form-panel">
      <h2 id="formHeading">Add a transaction</h2>

      <form id="txnForm" novalidate>
        <div class="field">
          <label for="title">Title</label>
          <input type="text" id="title" maxlength="60" placeholder="e.g. Groceries" autocomplete="off">
          <p class="error" id="titleError"></p>
        </div>

        <div class="field">
          <span class="label">Type</span>
          <div class="segmented">
            <input type="radio" id="typeExpense" name="type" value="expense" checked>
            <label for="typeExpense">Expense</label>
            <input type="radio" id="typeIncome" name="type" value="income">
            <label for="typeIncome">Income</label>
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="amount">Amount (₹)</label>
            <input type="number" id="amount" step="0.01" min="0" placeholder="0.00">
            <p class="error" id="amountError"></p>
          </div>
          <div class="field">
            <label for="date">Date</label>
            <input type="date" id="date">
            <p class="error" id="dateError"></p>
          </div>
        </div>

        <div class="field">
          <label for="category">Category</label>
          <select id="category"></select>
          <p class="error" id="categoryError"></p>
        </div>

        <div class="actions">
          <button type="submit" class="btn btn-primary" id="submitBtn">Add transaction</button>
          <button type="button" class="btn btn-ghost" id="cancelBtn" hidden>Cancel edit</button>
        </div>
      </form>

    </section>

    <!--history, filters, and closing tags-->
        <section class="panel history-panel">
      <div class="history-head">
        <h2>Transaction history</h2>
        <p class="result-count" id="resultCount"></p>
      </div>

      <div class="filters">
        <div class="field">
          <label for="search">Search by title</label>
          <input type="search" id="search" placeholder="Search…" autocomplete="off">
        </div>
        <div class="field">
          <label for="filterType">Type</label>
          <select id="filterType">
            <option value="all">All types</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
        </div>
        <div class="field">
          <label for="filterCategory">Category</label>
          <select id="filterCategory"></select>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th><th>Title</th><th>Category</th><th class="num">Amount</th><th></th>
            </tr>
          </thead>
          <tbody id="txnBody"></tbody>
        </table>
      </div>

      <div class="empty" id="emptyState" hidden>
        <p class="empty-title" id="emptyTitle">No transactions yet</p>
        <p class="empty-text" id="emptyText">Use the form to add your first income or expense.</p>
      </div>
    </section>
  </main>

  <div class="toast-area" id="toastArea"></div>

  <script src="script.js"></script>
</body>
</html>
